name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (errors only)
        # pyflakes also reports cosmetic warnings and DuckDB's by-name DataFrame
        # scans as "unused"; fail only on real errors.
        run: |
          python -m pyflakes osmia tests > pyflakes.txt || true
          cat pyflakes.txt
          ! grep -E "undefined name|imported but unused|redefinition of unused|syntax error" pyflakes.txt
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke
        env:
          OSMIA_HOME: ${{ runner.temp }}/osmia
        run: |
          mkdir -p "$OSMIA_HOME"
          python -m osmia --init-db
          python -m osmia --backup
          python -m osmia --help > /dev/null
