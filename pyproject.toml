[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmia"
version = "1.5.0"
description = "LLM-in-the-loop crypto market research system (paper trading only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.3",
    "duckdb>=1.0",
    "feedparser>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
osmia = "osmia.cli:main"

[tool.setuptools.packages.find]
include = ["osmia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
