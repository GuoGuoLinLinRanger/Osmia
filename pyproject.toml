[project]
name = "osmia"
version = "1.4.0"
description = "LLM-in-the-loop crypto market research system (paper trading only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.3",
    "duckdb>=1.0",
    "feedparser>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
